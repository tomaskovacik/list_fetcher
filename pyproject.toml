[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "list-fetcher"
version = "0.3.5"
description = "Export SharePoint Online lists with schema for backup and later restore work."
requires-python = ">=3.10"
dependencies = [
  "msal>=1.38.0",
  "requests>=2.32.0",
]

[project.scripts]
list-fetcher = "list_fetcher.cli:main"

[dependency-groups]
dev = ["coverage>=7.16.2"]

[tool.coverage.run]
source = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
