name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      # Two calls, not a duplicate: the first installs locked third-party deps
      # wheel-only (--no-build blocks running an sdist's setup script), the
      # second builds only our own trusted local project on top (it has no
      # prebuilt wheel, so it must be built, but it's our own source, not a
      # downloaded sdist).
      - name: Install dependencies
        run: |
          uv sync --locked --no-install-project --no-build
          uv sync --locked

      - name: Run unit tests
        run: uv run --no-sync --no-build python -m unittest discover -s tests -q

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build --tag list-fetcher:ci .
